<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Career Future - Connection Error</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .error-container {
      text-align: center;
      padding: 3rem;
      max-width: 500px;
    }
    .error-icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.8rem; margin-bottom: 1rem; color: #fff; }
    p { font-size: 1rem; line-height: 1.6; margin-bottom: 2rem; color: #aaa; }
    .retry-btn {
      background: #4361ee;
      color: white;
      border: none;
      padding: 0.8rem 2rem;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .retry-btn:hover { background: #3a56d4; }
    .brand { margin-top: 3rem; font-size: 0.85rem; color: #555; }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-icon">&#9888;</div>
    <h1>Dashboard Not Available</h1>
    <p>The Career Future dashboard is starting up. Please wait a moment and try again.</p>
    <button class="retry-btn" onclick="window.location.reload()">Retry Connection</button>
    <p class="brand">Career Future v1.0.0</p>
  </div>
</body>
</html>
