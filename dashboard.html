<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selector Discovery Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
  h1 { font-size: 1.5rem; margin-bottom: 20px; color: #38bdf8; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .card { background: #1e293b; border-radius: 12px; padding: 20px; text-align: center; }
  .card .value { font-size: 2.5rem; font-weight: 700; }
  .card .label { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
  .pending .value { color: #fbbf24; }
  .processing .value { color: #38bdf8; }
  .done .value { color: #4ade80; }
  .failed .value { color: #f87171; }
  .high .value { color: #4ade80; }
  .medium .value { color: #fbbf24; }
  .low .value { color: #fb923c; }
  .total .value { color: #e2e8f0; }
  .enabled .value { color: #a78bfa; }
  h2 { font-size: 1.1rem; margin-bottom: 12px; color: #94a3b8; }
  .section { margin-bottom: 32px; }
  table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #334155; font-size: 0.85rem; }
  th { background: #0f172a; color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
  .status-done { color: #4ade80; }
  .status-failed { color: #f87171; }
  .status-processing { color: #38bdf8; }
  .status-pending { color: #fbbf24; }
  .refresh-info { font-size: 0.75rem; color: #475569; margin-bottom: 16px; }
  .progress-bar { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin-bottom: 24px; display: flex; }
  .progress-bar .seg { height: 100%; transition: width 0.5s; }
  .seg-done { background: #4ade80; }
  .seg-processing { background: #38bdf8; }
  .seg-failed { background: #f87171; }
  .seg-pending { background: #fbbf24; }
</style>
</head>
<body>
  <h1>Selector Discovery Dashboard</h1>
  <div class="refresh-info">Auto-refreshes every 5 seconds</div>

  <div class="progress-bar" id="progress"></div>

  <div class="cards" id="cards">
    <div class="card total"><div class="value" id="total">-</div><div class="label">Total</div></div>
    <div class="card pending"><div class="value" id="pending">-</div><div class="label">Pending</div></div>
    <div class="card processing"><div class="value" id="processing">-</div><div class="label">Processing</div></div>
    <div class="card done"><div class="value" id="done">-</div><div class="label">Done</div></div>
    <div class="card failed"><div class="value" id="failed">-</div><div class="label">Failed</div></div>
    <div class="card high"><div class="value" id="high_confidence">-</div><div class="label">High Conf</div></div>
    <div class="card medium"><div class="value" id="medium_confidence">-</div><div class="label">Med Conf</div></div>
    <div class="card low"><div class="value" id="low_confidence">-</div><div class="label">Low Conf</div></div>
    <div class="card enabled"><div class="value" id="enabled">-</div><div class="label">Enabled</div></div>
  </div>

  <div class="section" id="agents-section" style="display:none">
    <h2>Active Agents</h2>
    <table><thead><tr><th>Agent ID</th><th>Processing</th><th>Last Active</th></tr></thead>
    <tbody id="agents-body"></tbody></table>
  </div>

  <div class="section">
    <h2>Recent Activity</h2>
    <table><thead><tr><th>Company</th><th>Status</th><th>Confidence</th><th>Agent</th><th>Completed</th></tr></thead>
    <tbody id="recent-body"></tbody></table>
  </div>

<script>
async function refresh() {
  try {
    const res = await fetch('/api/stats');
    const { counts, agents, recent } = await res.json();

    ['total','pending','processing','done','failed','high_confidence','medium_confidence','low_confidence','enabled'].forEach(k => {
      const el = document.getElementById(k);
      if (el) el.textContent = counts[k] || '0';
    });

    // Progress bar
    const t = parseInt(counts.total) || 1;
    const bar = document.getElementById('progress');
    bar.innerHTML = [
      { cls: 'seg-done', pct: (counts.done / t * 100) },
      { cls: 'seg-processing', pct: (counts.processing / t * 100) },
      { cls: 'seg-failed', pct: (counts.failed / t * 100) },
      { cls: 'seg-pending', pct: (counts.pending / t * 100) },
    ].map(s => `<div class="seg ${s.cls}" style="width:${s.pct}%"></div>`).join('');

    // Agents
    const agentSection = document.getElementById('agents-section');
    const agentBody = document.getElementById('agents-body');
    if (agents.length > 0) {
      agentSection.style.display = 'block';
      agentBody.innerHTML = agents.map(a =>
        `<tr><td>${a.agent_id}</td><td>${a.count}</td><td>${new Date(a.last_active).toLocaleTimeString()}</td></tr>`
      ).join('');
    } else {
      agentSection.style.display = 'none';
    }

    // Recent
    const recentBody = document.getElementById('recent-body');
    recentBody.innerHTML = recent.map(r =>
      `<tr>
        <td>${r.company_name}</td>
        <td class="status-${r.status}">${r.status}</td>
        <td>${r.selector_confidence || '-'}</td>
        <td>${r.agent_id || '-'}</td>
        <td>${r.completed_at ? new Date(r.completed_at).toLocaleString() : '-'}</td>
      </tr>`
    ).join('');
  } catch (e) {
    console.error('Refresh failed:', e);
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
